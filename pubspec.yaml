name: food_delivery_landing
description: >-
  Kiko Mart storefront landing page — the public marketing site a store owner
  shares with their customers. Built with Jaspr, rendered as a static site.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.0
  # jaspr_router was dropped: this is a single page with hash anchors, so
  # plain <a href="#..."> does the job with one fewer dependency to ship.
  universal_web: ^1.1.1+1

dev_dependencies:
  build_runner: ^2.15.0
  build_web_compilers: ^4.4.19
  jaspr_builder: ^0.23.0
  lints: ^5.0.0

jaspr:
  mode: static
  flutter: plugins
