name: food_delivery_landing
description: >-
  Kiko Mart storefront landing page — the public marketing site a store owner
  shares with their customers. Built with Jaspr, rendered as a static site.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.0
  # Back in use: the router is what registers /terms and /privacy with the
  # static build so each becomes a real, crawlable page. Navigation itself is
  # still plain <a href>, so the router never ships to the browser.
  jaspr_router: ^0.8.2
  universal_web: ^1.1.1+1
  # Works on the Dart VM and in the browser, so one Appwrite client
  # serves both the build-time render and the runtime refresh.
  http: ^1.2.2

dev_dependencies:
  build_runner: ^2.15.0
  build_web_compilers: ^4.4.19
  jaspr_builder: ^0.23.0
  lints: ^5.0.0

jaspr:
  mode: static
  flutter: plugins
